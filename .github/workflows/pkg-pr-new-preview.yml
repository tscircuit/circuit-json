name: Publish PR package preview

on:
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun add --dev pkg-pr-new
      - run: bun run pkg-pr-new publish --commentWithSha --comment=off
